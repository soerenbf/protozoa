syntax = "proto3";
package same;
import "a/common.proto";
import "b/common.proto";
import "decode.proto";
import "shadow.proto";
import "repeated.proto";
import "map.proto";
import "service.proto";
import "google/protobuf/struct.proto";
message Root {
  Envelope.Item item = 1;
  other.Item other = 2;
  runtime.Token token = 3;
  Envelope.State state = 4;
  optional Envelope.State optional_state = 5;
  repeated Envelope.State states = 6;
  repeated Envelope.Item items = 7;
  map<string, Envelope.Item> items_by_name = 8;
  map<string, Envelope.State> states_by_name = 9;
  Root next = 10;
  oneof pick { Envelope.Item chosen = 11; Envelope.State status = 12; }
  map<string, Value> values = 13;
}
