syntax = "proto3";
package sample.base.child;
import "naming_base.proto";
enum Unique { DISTINCT = 0; OTHER = 1; }
enum Colliding { SampleBaseItem = 0; SampleBaseChildFirstResponseV0 = 1; }
message First {
  enum State { ZERO = 0; ONE = 1; }
  message Inner { int32 specificationHash = 1; }
  message Middle {
    message Inner { string micro_CCD = 1; }
    message Deep {
      Inner nearest = 1;
      First.Inner parent = 2;
      Second.Inner sibling = 3;
      .sample.base.Item absolute = 4;
      sample.base.Item ancestor = 5;
      optional State state = 6;
      message Item { string local = 1; }
      Item shadow = 7;
    }
  }
  optional State state = 1;
  repeated State states = 4;
  map<string, State> flags = 5;
  // Keep owner-scoped oneof names alongside colliding enum constructors.
  oneof response { Inner v0 = 6; State type = 7; }
}
message Second {
  message Inner { bool type = 1; }
  enum State { ZERO = 0; ONE = 1; }
  optional State state = 1;
}
