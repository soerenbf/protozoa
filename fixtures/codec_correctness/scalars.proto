syntax = "proto3";
message ScalarInt32 { int32 value = 1; }
message OptionalInt32 { optional int32 value = 1; }
message ChoiceInt32 { oneof selection { int32 value = 1; } }
message RepeatedInt32 { repeated int32 value = 1; }
message ScalarInt64 { int64 value = 1; }
message OptionalInt64 { optional int64 value = 1; }
message ChoiceInt64 { oneof selection { int64 value = 1; } }
message RepeatedInt64 { repeated int64 value = 1; }
message ScalarUint32 { uint32 value = 1; }
message OptionalUint32 { optional uint32 value = 1; }
message ChoiceUint32 { oneof selection { uint32 value = 1; } }
message RepeatedUint32 { repeated uint32 value = 1; }
message ScalarUint64 { uint64 value = 1; }
message OptionalUint64 { optional uint64 value = 1; }
message ChoiceUint64 { oneof selection { uint64 value = 1; } }
message RepeatedUint64 { repeated uint64 value = 1; }
message ScalarSint32 { sint32 value = 1; }
message OptionalSint32 { optional sint32 value = 1; }
message ChoiceSint32 { oneof selection { sint32 value = 1; } }
message RepeatedSint32 { repeated sint32 value = 1; }
message ScalarSint64 { sint64 value = 1; }
message OptionalSint64 { optional sint64 value = 1; }
message ChoiceSint64 { oneof selection { sint64 value = 1; } }
message RepeatedSint64 { repeated sint64 value = 1; }
message ScalarFixed32 { fixed32 value = 1; }
message OptionalFixed32 { optional fixed32 value = 1; }
message ChoiceFixed32 { oneof selection { fixed32 value = 1; } }
message RepeatedFixed32 { repeated fixed32 value = 1; }
message ScalarFixed64 { fixed64 value = 1; }
message OptionalFixed64 { optional fixed64 value = 1; }
message ChoiceFixed64 { oneof selection { fixed64 value = 1; } }
message RepeatedFixed64 { repeated fixed64 value = 1; }
message ScalarSfixed32 { sfixed32 value = 1; }
message OptionalSfixed32 { optional sfixed32 value = 1; }
message ChoiceSfixed32 { oneof selection { sfixed32 value = 1; } }
message RepeatedSfixed32 { repeated sfixed32 value = 1; }
message ScalarSfixed64 { sfixed64 value = 1; }
message OptionalSfixed64 { optional sfixed64 value = 1; }
message ChoiceSfixed64 { oneof selection { sfixed64 value = 1; } }
message RepeatedSfixed64 { repeated sfixed64 value = 1; }
message ScalarFloat { float value = 1; }
message OptionalFloat { optional float value = 1; }
message ChoiceFloat { oneof selection { float value = 1; } }
message RepeatedFloat { repeated float value = 1; }
message ScalarDouble { double value = 1; }
message OptionalDouble { optional double value = 1; }
message ChoiceDouble { oneof selection { double value = 1; } }
message RepeatedDouble { repeated double value = 1; }
message ScalarBool { bool value = 1; }
message OptionalBool { optional bool value = 1; }
message ChoiceBool { oneof selection { bool value = 1; } }
message RepeatedBool { repeated bool value = 1; }
message MapInt32 { map<int32, int32> values = 1; }
message MapInt64 { map<int64, int64> values = 1; }
message MapUint32 { map<uint32, uint32> values = 1; }
message MapUint64 { map<uint64, uint64> values = 1; }
message MapSint32 { map<sint32, sint32> values = 1; }
message MapSint64 { map<sint64, sint64> values = 1; }
message MapFixed32 { map<fixed32, fixed32> values = 1; }
message MapFixed64 { map<fixed64, fixed64> values = 1; }
message MapSfixed32 { map<sfixed32, sfixed32> values = 1; }
message MapSfixed64 { map<sfixed64, sfixed64> values = 1; }
message MapFloat { map<sint32, float> values = 1; }
message MapDouble { map<sint32, double> values = 1; }
enum State { ZERO = 0; FIRST = 1; SECOND = 2; }
message EnumList { repeated State value = 1; }
