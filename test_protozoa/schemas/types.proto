syntax = "proto3";

package types;

message AllTypes {
  double double_field = 1;
  float float_field = 2;
  int32 int32_field = 3;
  int64 int64_field = 4;
  uint32 uint32_field = 5;
  uint64 uint64_field = 6;
  sint32 sint32_field = 7;
  sint64 sint64_field = 8;
  fixed32 fixed32_field = 9;
  fixed64 fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool bool_field = 13;
  string string_field = 14;
  bytes bytes_field = 15;
}

message RepeatedTypes {
  repeated string strings = 1;
  repeated int32 numbers = 2;
  repeated bool flags = 3;
  repeated OptionalTypes messages = 4;
  repeated OptionalTypes.State states = 5;

  message ValuesFields {
    repeated string values = 1;
    string label = 2;
  }
}

message OptionalTypes {
  enum State {
    ZERO = 0;
    READY = 1;
    NEGATIVE = -1;
  }
  optional string maybe_string = 1;
  optional int32 maybe_number = 2;
  OptionalTypes next = 3;
  optional State state = 4;
  oneof choice {
    int64 number = 5;
    OptionalTypes message = 6;
    State selected_state = 7;
    bool flag = 56;
  }
}

message MapTypes {
  map<string, string> string_map = 1;
  map<int32, string> int_map = 2;
  map<string, OptionalTypes> messages = 3;
  map<string, OptionalTypes.State> states = 4;
  map<sint32, fixed32> numeric_defaults = 5;

  message ValuesFields {
    map<string, string> values = 1;
    string label = 2;
  }
}
